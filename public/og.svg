<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#ffedc3" stop-opacity=".9"/>
      <stop offset=".62" stop-color="#f2f0e9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e9e7df" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#24324a" stroke-opacity=".04"/>
    </pattern>
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#24324a" flood-opacity=".16"/>
    </filter>
    <filter id="lampGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <g id="house">
      <path d="M-28-5 0-30 28-5v34h-56z" fill="#fffdfa" stroke="#9fa4a5" stroke-width="2"/>
      <rect x="-7" y="9" width="14" height="20" fill="#bdc0bd"/>
    </g>
    <g id="litHouse">
      <circle r="50" fill="#efaa32" fill-opacity=".22" filter="url(#lampGlow)"/>
      <path d="M-28-5 0-30 28-5v34h-56z" fill="#fff4d6" stroke="#efaa32" stroke-width="2"/>
      <rect x="-7" y="9" width="14" height="20" fill="#efaa32"/>
      <circle cx="0" cy="48" r="12" fill="#efaa32"/>
      <text x="0" y="52" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="800">灯</text>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#f2f0e9"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="530" cy="320" r="360" fill="url(#glow)"/>

  <g transform="translate(57 50)">
    <g transform="translate(0 0)">
      <circle cx="24" cy="24" r="21" fill="none" stroke="#364a72" stroke-width="2"/>
      <path d="m16 22 8-9 8 9v12H16z" fill="#364a72"/>
      <circle cx="38" cy="10" r="7" fill="#efaa32" stroke="#fffdfa" stroke-width="3"/>
      <text x="62" y="33" fill="#24324a" font-family="sans-serif" font-size="27" font-weight="800" letter-spacing="3">回覧灯</text>
    </g>

    <g transform="translate(45 72)">
      <circle cx="450" cy="252" r="220" fill="none" stroke="#364a72" stroke-opacity=".42" stroke-width="2" stroke-dasharray="5 8"/>
      <circle cx="450" cy="252" r="176" fill="none" stroke="#364a72" stroke-opacity=".15" stroke-width="2"/>

      <g transform="translate(450 27)"><use href="#litHouse"/></g>
      <g transform="translate(609 93)"><use href="#litHouse"/></g>
      <g transform="translate(675 252)"><use href="#litHouse"/></g>
      <g transform="translate(609 411)"><use href="#litHouse"/></g>
      <g transform="translate(450 477)"><use href="#litHouse"/></g>
      <g transform="translate(291 411)"><use href="#litHouse"/></g>
      <g transform="translate(225 252)">
        <use href="#house"/>
        <circle cx="0" cy="48" r="12" fill="#f2f0e9" stroke="#aeb1ae"/>
        <text x="0" y="52" text-anchor="middle" fill="#969b98" font-family="sans-serif" font-size="12" font-weight="700">・</text>
      </g>
      <g transform="translate(291 93)">
        <use href="#house"/>
        <circle cx="0" cy="48" r="12" fill="#f2f0e9" stroke="#aeb1ae"/>
        <text x="0" y="52" text-anchor="middle" fill="#969b98" font-family="sans-serif" font-size="12" font-weight="700">・</text>
      </g>

      <g transform="translate(336 115) rotate(-1)" filter="url(#paperShadow)">
        <rect width="228" height="275" fill="#fffdfa" stroke="#d2cbbb" stroke-width="2"/>
        <rect x="-8" y="19" width="244" height="7" fill="#efaa32"/>
        <rect x="79" y="46" width="70" height="29" fill="none" stroke="#24324a" stroke-width="2"/>
        <text x="114" y="66" text-anchor="middle" fill="#24324a" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="5">回 覧</text>
        <text x="114" y="116" text-anchor="middle" fill="#24324a" font-family="serif" font-size="23" font-weight="700">夏まつり準備の</text>
        <text x="114" y="150" text-anchor="middle" fill="#24324a" font-family="serif" font-size="23" font-weight="700">お知らせ</text>
        <path d="M34 178h160M34 198h160M34 218h122" stroke="#d9d8d0" stroke-width="2"/>
        <text x="114" y="250" text-anchor="middle" fill="#5c667a" font-family="sans-serif" font-size="12">8月10日まで</text>
      </g>
    </g>

    <g transform="translate(824 128)">
      <rect width="260" height="320" fill="#fffdfa" stroke="#d9d8d0" stroke-width="2"/>
      <rect width="260" height="64" fill="#253757"/>
      <text x="22" y="27" fill="#fff" fill-opacity=".62" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="2">READ</text>
      <text x="22" y="50" fill="#fff" font-family="sans-serif" font-size="22" font-weight="800">7 / 12</text>
      <circle cx="226" cy="32" r="8" fill="#efaa32"/>
      <rect x="22" y="91" width="216" height="7" fill="#deddd5"/>
      <rect x="22" y="91" width="126" height="7" fill="#efaa32"/>
      <text x="22" y="130" fill="#5c667a" font-family="sans-serif" font-size="12">あと5世帯です</text>
      <path d="M22 157h216M22 227h216" stroke="#d9d8d0"/>
      <circle cx="36" cy="191" r="7" fill="#6b8e7d"/>
      <text x="55" y="196" fill="#5c667a" font-family="sans-serif" font-size="12">参加</text>
      <text x="218" y="199" text-anchor="end" fill="#24324a" font-family="sans-serif" font-size="24" font-weight="800">5</text>
      <circle cx="36" cy="261" r="7" fill="#efaa32"/>
      <text x="55" y="266" fill="#5c667a" font-family="sans-serif" font-size="12">未定</text>
      <text x="218" y="269" text-anchor="end" fill="#24324a" font-family="sans-serif" font-size="24" font-weight="800">2</text>
      <rect x="22" y="291" width="216" height="1" fill="#d9d8d0"/>
    </g>

    <g transform="translate(824 479)">
      <text x="0" y="0" fill="#24324a" font-family="serif" font-size="22" font-weight="700">読んだ灯りが、ひと回り。</text>
      <text x="0" y="34" fill="#5c667a" font-family="sans-serif" font-size="13">登録なし・一回覧だけ・21日で削除</text>
    </g>
  </g>
</svg>
